<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your WireWise account to book electrical services, track jobs, and manage your service history online.">
  <title>Create Account | WireWise Electrician</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23F59E0B'/%3E%3Cpath d='M22 8 L14 20 H20 L17 32 L28 18 H22 L26 8 Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-bg-pattern" aria-hidden="true"></div>
<div class="auth-corner">
  <button class="icon-btn" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff" data-theme-toggle aria-label="Toggle theme">
    <svg data-moon-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg data-sun-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<main class="auth-page" role="main">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo">
      <a href="index.html" aria-label="WireWise Home">
        <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="var(--primary)"/>
          <path d="M22 8 L14 20 H20 L17 32 L28 18 H22 L26 8 Z" fill="white"/>
        </svg>
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.125rem;color:var(--text-dark)">Wire<span style="color:var(--primary)">Wise</span></span>
      </a>
    </div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-sub">Join thousands of homeowners who trust WireWise.</p>

    <a href="#" class="social-btn" id="signup-google-btn" aria-label="Sign up with Google">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign up with Google
    </a>

    <div class="social-divider">or register with email</div>

    <form id="signup-form" data-ajax aria-label="Sign up form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signup-fname">First Name <span style="color:var(--accent-red)">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            <input class="form-control" type="text" id="signup-fname" name="fname" placeholder="John" required autocomplete="given-name">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-lname">Last Name <span style="color:var(--accent-red)">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            <input class="form-control" type="text" id="signup-lname" name="lname" placeholder="Smith" required autocomplete="family-name">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address <span style="color:var(--accent-red)">*</span></label>
        <div class="input-wrapper">
          <div class="input-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <input class="form-control" type="email" id="signup-email" name="email" placeholder="you@email.com" required autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-phone">Phone Number</label>
        <div class="input-wrapper">
          <div class="input-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.08.96.26 1.9.55 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 5.18 5.18l1-1.27a2 2 0 0 1 2.11-.45c.91.29 1.85.47 2.81.55A2 2 0 0 1 22 16.92z"/></svg></div>
          <input class="form-control" type="tel" id="signup-phone" name="phone" placeholder="+1 (555) 000-0000" autocomplete="tel">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-password">Password <span style="color:var(--accent-red)">*</span></label>
        <div class="input-wrapper">
          <div class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <input class="form-control" type="password" id="signup-password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password">
          <button type="button" class="password-toggle" id="signup-pw-toggle" aria-label="Toggle password visibility">
            <svg data-eye-open viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg data-eye-off viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-confirm">Confirm Password <span style="color:var(--accent-red)">*</span></label>
        <div class="input-wrapper">
          <div class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <input class="form-control" type="password" id="signup-confirm" name="confirm" placeholder="Repeat password" required autocomplete="new-password">
        </div>
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label class="checkbox-label">
          <input type="checkbox" id="signup-terms" name="terms" required>
          I agree to the <a href="coming-soon.html" class="auth-link">Terms of Service</a> and <a href="coming-soon.html" class="auth-link">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" id="signup-submit-btn" class="btn btn-primary" style="width:100%;justify-content:center;font-size:1rem;padding:0.875rem">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html" class="auth-link" id="signup-to-login-link">Sign in</a></p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
